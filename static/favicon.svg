<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Aura -->
  <path d="M32 4 L54 12 V30 C54 44.5 44.2 56.4 32 60 C19.8 56.4 10 44.5 10 30 V12 L32 4 Z" 
        fill="url(#logo-grad)" opacity="0.18" />
        
  <!-- Outer Shield Outline -->
  <path d="M32 6 L52 13.5 V30 C52 43 43.3 53.6 32 57 C20.7 53.6 12 43 12 30 V13.5 L32 6 Z" 
        stroke="url(#logo-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- FinSight Iris / Lens Optics -->
  <path d="M19 31 C24 23 40 23 45 31 C40 39 24 39 19 31 Z" 
        stroke="url(#logo-grad)" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Center Pupil & Target Reticle -->
  <circle cx="32" cy="31" r="5" fill="url(#logo-grad)" />
  <circle cx="32" cy="31" r="2" fill="#ffffff" />
  
  <!-- Sight Nodes -->
  <circle cx="32" cy="19" r="1.5" fill="#38bdf8" />
  <circle cx="32" cy="43" r="1.5" fill="#38bdf8" />
</svg>
